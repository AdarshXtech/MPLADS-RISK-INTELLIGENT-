# Render Blueprint Infrastructure as Code for MPLADS Risk Intelligence System
# Backend (FastAPI) and Database (PostgreSQL)
# Docs: https://render.com/docs/blueprint-spec

services:
  # Backend API Service (FastAPI)
  - type: web
    name: mplads-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --frozen uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-db
          property: connectionString
      - key: MPLADS_REVIEW_API_KEY
        generateValue: true

databases:
  - name: mplads-db
    databaseName: mplads
    user: mplads_app
    plan: free
    region: oregon
